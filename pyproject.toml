[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "court-auction-insights"
version = "0.1.0"
description = "Local AI review UI for court auction data"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115",
  "jinja2>=3.1",
  "pydantic>=2.11",
  "pydantic-settings>=2.9",
  "requests>=2.32",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "pytest>=8.3",
]

[tool.setuptools.packages.find]
where = ["src"]
